<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <!-- Top Navigation -->
  <header class="masthead">
    <div class="masthead-inner">
      <div class="site-title">
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}class="active"{% endif %}>About</a>
        <a href="{{ '/research/' | relative_url }}" {% if page.url == '/research/' %}class="active"{% endif %}>Research</a>
        <a href="{{ '/teaching/' | relative_url }}" {% if page.url == '/teaching/' %}class="active"{% endif %}>Teaching</a>
        <a href="{{ '/cv/' | relative_url }}" {% if page.url == '/cv/' %}class="active"{% endif %}>CV</a>
      </nav>
    </div>
  </header>

  <div class="page-wrapper">
    {% include sidebar.html %}
    <main class="main-content">
      {{ content }}
    </main>
  </div>
  
  <footer class="site-footer">
  <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}. Powered by <a href="https://jekyllrb.com">Jekyll</a> & <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a>, a fork of <a href="https://mademistakes.com/work/minimal-mistakes-jekyll-theme/">Minimal Mistakes</a>.<br>
  Site last updated {{ 'now' | date: "%Y-%m-%d" }}.</p>
</footer>
</body>
</html>
